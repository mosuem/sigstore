name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dart-rust-ci:
    name: Dart & Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Dart Dependencies
        run: dart pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart Code
        run: dart analyze --fatal-infos

      - name: Verify Rust Formatting
        run: cargo fmt --check --manifest-path rust/Cargo.toml

      - name: Run Rust Clippy Linter
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

      - name: Run Dart Unit Tests (Checkout Mode)
        run: dart test

  conformance:
    name: Sigstore Conformance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 'stable'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Conformance Test Suite
        run: ./tool/run_conformance_tests.sh

  # Build hooks only receive an allow-listed environment (so an env var like
  # SIGSTORE_BUILD_MODE never reaches hook/build.dart), and `hooks.user_defines`
  # are only read from the root package, whose pubspec selects `checkout` for
  # development. To exercise what `dart pub add sigstore` gives users, this job
  # runs the tests from a scratch consumer package that depends on this
  # checkout: the default `fetch` build mode with the precompiled binaries pinned
  # in lib/src/hook_helpers/hashes.dart.
  #
  # On pull requests the job is advisory: a PR that changes the FFI surface
  # fails here until the matching `binaries-v<version>` release exists and
  # hashes.dart points at it (see "Releasing" in README.md). On `main` it must
  # pass, so `main` is never left pointing at binaries that don't match it.
  fetch-mode-ci:
    name: Fetch Mode Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sigstore

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      - name: Create Consumer Package
        shell: bash
        run: |
          mkdir consumer
          cp -r sigstore/test consumer/test
          cat > consumer/pubspec.yaml << 'EOF'
          name: sigstore_fetch_mode_consumer
          publish_to: none
          environment:
            sdk: ^3.10.0
          dependencies:
            sigstore:
              path: ../sigstore
          dev_dependencies:
            test: ^1.25.0
          EOF

      - name: Run Dart Unit Tests (Fetch Mode)
        working-directory: consumer
        run: |
          dart pub get
          dart test

