name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dart-rust-ci:
    name: Dart & Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Dart Dependencies
        run: dart pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart Code
        run: dart analyze --fatal-infos

      - name: Verify Rust Formatting
        run: cargo fmt --check --manifest-path rust/Cargo.toml

      - name: Run Rust Clippy Linter
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

      - name: Run Dart Unit Tests (Checkout Mode)
        env:
          SIGSTORE_BUILD_MODE: checkout
        run: dart test

  conformance:
    name: Sigstore Conformance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 'stable'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Conformance Test Suite
        env:
          SIGSTORE_BUILD_MODE: checkout
        run: ./tool/run_conformance_tests.sh

  fetch-mode-ci:
    name: Fetch Mode Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      - name: Install Dart Dependencies
        run: dart pub get

      - name: Run Dart Unit Tests (Fetch Mode)
        env:
          SIGSTORE_BUILD_MODE: fetch
        run: dart test

