name: Release Binaries

on:
  push:
    tags:
      - 'binaries-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. binaries-v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }}, ${{ matrix.compiletype }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiletype: [dynamic, static]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 'stable'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # The targets below mirror `linuxTargets` / `macosTargets` /
      # `windowsTargets` in lib/src/hook_helpers/builder.dart. `sigstore_ffi` is
      # pure Rust (all C crypto lives in package:boring), so cross-compiling only
      # needs the Rust standard library for the target plus a linker.
      - name: Setup Linux Cross-Compilation (aarch64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

          mkdir -p .cargo
          cat << EOCONFIG >> .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOCONFIG

      - name: Setup macOS Cross-Compilation (x86_64)
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin

      - name: Precompile Binaries
        run: dart run tool/precompile_binaries.dart --compile-type=${{ matrix.compiletype }} --out-dir=bin

      - name: Clean Windows Auxiliary Files
        if: matrix.os == 'windows-latest'
        shell: bash
        run: rm -f bin/*.exp bin/*.lib bin/*.pdb

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.compiletype }}
          path: bin/*

  upload-release-assets:
    name: Upload Binaries to GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 'stable'

      - name: Download Built Binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: bin_artifacts
          merge-multiple: true

      - name: Prepare Release Directory & Checksums
        run: |
          mkdir -p release_bin
          cp bin_artifacts/* release_bin/
          
          echo "==> Computing SHA-256 Checksums..."
          cd release_bin
          sha256sum libsigstore_ffi-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "==> Ensuring release for $TAG exists..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release of precompiled Sigstore FFI native binaries for fetch mode."
          fi
          
          echo "==> Uploading binary assets to release $TAG..."
          find release_bin -type f -exec gh release upload "$TAG" --clobber {} +

      - name: Generate Dart Hashes Table
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "### Generated File Hashes for $TAG" >> $GITHUB_STEP_SUMMARY
          echo '```dart' >> $GITHUB_STEP_SUMMARY
          echo "const version = '$TAG';" >> $GITHUB_STEP_SUMMARY
          echo "const fileHashes = <(String, String), String>{" >> $GITHUB_STEP_SUMMARY
          while IFS=' ' read -r hash filename; do
            if [[ "$filename" =~ libsigstore_ffi-(dynamic|static)-(.+) ]]; then
              libtype="${BASH_REMATCH[1]}"
              target="${BASH_REMATCH[2]}"
              echo "  ('$target', '$libtype'): '$hash'," >> $GITHUB_STEP_SUMMARY
            fi
          done < release_bin/SHA256SUMS.txt
          echo "};" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
