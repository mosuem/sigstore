[package]
name = "sigstore_ffi"
version = "0.2.0"
edition = "2021"

[lib]
# - cdylib: produces the shared library (.so / .dylib / .dll) loaded by Dart FFI
# - staticlib: supports static linking on platforms that require it (e.g. iOS)
# - rlib: allows Rust unit/integration tests and Diplomat tools to inspect the crate
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
diplomat = "0.16.1"
diplomat-runtime = "0.16.0"

# `default-features = false` disables `sigstore-rust`'s built-in `reqwest`/`tokio`
# HTTP client and `aws-lc-rs` crypto backend so we can drive TUF HTTP requests from
# Dart's `HttpClient` and route all crypto through `package:boring` via our custom
# `sigstore_crypto::CryptoProvider` (`src/boring_provider.rs`).
sigstore-crypto = { git = "https://github.com/jku/sigstore-rust", rev = "5181a8db4116cbec59c49e8809cc1f9f2ff30d21", default-features = false }
sigstore-verify = { git = "https://github.com/jku/sigstore-rust", rev = "5181a8db4116cbec59c49e8809cc1f9f2ff30d21", default-features = false }
sigstore-types = { git = "https://github.com/jku/sigstore-rust", rev = "5181a8db4116cbec59c49e8809cc1f9f2ff30d21" }
sigstore-trust-root = { git = "https://github.com/jku/sigstore-rust", rev = "5181a8db4116cbec59c49e8809cc1f9f2ff30d21", default-features = false }
sigstore-tuf = { git = "https://github.com/jku/sigstore-rust", rev = "5181a8db4116cbec59c49e8809cc1f9f2ff30d21", default-features = false }
jiff = "0.2"
serde_json = "1.0"
thiserror = "2.0"

# Optimize release builds for small binary size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
