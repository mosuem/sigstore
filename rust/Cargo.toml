[package]
name = "sigstore_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
diplomat = "0.16.1"
diplomat-runtime = "0.16.0"
sigstore-verify = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-types = "0.11"
sigstore-trust-root = { version = "0.11", default-features = false, features = ["rustls", "tuf"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
